    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0fdbfaa5-1bb3.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
      warehouse_id: 08b05d2106b13340
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-0fdbfaa5-1bb3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thapasammy0294@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thapasammy0294@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_prod
      schema: prod
      warehouse_id: 08b05d2106b13340
    permissions:
      - user_name: thapasammy0294@gmail.com
        level: CAN_MANAGE
